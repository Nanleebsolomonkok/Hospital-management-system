<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password — MediCore HMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/medicore.css">
</head>
<body>
<div class="mobile-topbar" id="mobileTopbar"><button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button><a href="/dashboard" class="mobile-brand"><div class="mobile-brand-icon">🏥</div><strong>MediCore</strong></a></div>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand"><a href="/dashboard" class="brand-logo"><div class="brand-icon">🏥</div><div class="brand-text"><strong>MediCore</strong><span>Hospital MS</span></div></a></div>
  <div class="sidebar-user"><div class="user-avatar" id="userAvatar">U</div><div class="user-info"><div class="user-name" id="userName">Loading…</div><span class="role-pill" id="userRole"></span></div></div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer"><a href="#" class="logout-btn" onclick="doLogout()"><span>⏻</span> Sign Out</a></div>
</aside>
<main class="main">
  <header class="topbar">
    <div><div class="page-title">Change Password</div></div>
    <div class="topbar-actions"><a href="/dashboard" class="topbar-btn btn-secondary">← Back</a></div>
  </header>
  <div class="content-area">
    <div id="alertContainer" class="alerts"></div>
    <div style="max-width:500px;">
      <div class="card">
        <div class="card-header"><div class="card-title">🔐 Update Your Password</div></div>
        <div class="card-body">
          <div style="padding:12px 14px;background:var(--info-bg);border:1px solid var(--info-bdr);border-radius:var(--radius-sm);margin-bottom:20px;">
            <p style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--info);margin-bottom:8px;">Password Requirements</p>
            <ul style="list-style:none;display:flex;flex-direction:column;gap:5px;">
              <li id="req-len"  style="font-size:12.5px;color:var(--text-muted);display:flex;align-items:center;gap:7px;"><span>○</span> Minimum 8 characters</li>
              <li id="req-up"   style="font-size:12.5px;color:var(--text-muted);display:flex;align-items:center;gap:7px;"><span>○</span> At least one uppercase letter</li>
              <li id="req-low"  style="font-size:12.5px;color:var(--text-muted);display:flex;align-items:center;gap:7px;"><span>○</span> At least one lowercase letter</li>
              <li id="req-num"  style="font-size:12.5px;color:var(--text-muted);display:flex;align-items:center;gap:7px;"><span>○</span> At least one number</li>
            </ul>
          </div>
          <div class="form-group"><label class="form-label required">Current Password</label><input type="password" id="current_password" class="form-control" placeholder="Enter your current password"></div>
          <div class="form-group"><label class="form-label required">New Password</label><input type="password" id="new_password" class="form-control" placeholder="Enter a strong new password" oninput="checkReqs(this.value)"></div>
          <div class="form-group"><label class="form-label required">Confirm New Password</label><input type="password" id="confirm_password" class="form-control" placeholder="Re-enter your new password"></div>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-bottom:24px;">
        <a href="/dashboard" class="topbar-btn btn-secondary">Cancel</a>
        <button class="topbar-btn btn-accent" id="submitBtn" onclick="submit()">🔐 Update Password</button>
      </div>
    </div>
  </div>
</main>
<script src="/static/js/medicore.js"></script>
<script>
HMS.init();
function check(id,ok){var el=document.getElementById(id);el.style.color=ok?'var(--success)':'var(--text-muted)';el.querySelector('span').textContent=ok?'✓':'○';}
function checkReqs(pw){check('req-len',pw.length>=8);check('req-up',/[A-Z]/.test(pw));check('req-low',/[a-z]/.test(pw));check('req-num',/[0-9]/.test(pw));}
function g(id){return document.getElementById(id).value.trim();}
function submit(){
  var curr=g('current_password'),np=g('new_password'),cp=g('confirm_password');
  if(!curr||!np||!cp){HMS.showAlert('All fields are required.','error');return;}
  if(np!==cp){HMS.showAlert('New passwords do not match.','error');return;}
  if(np.length<8){HMS.showAlert('Password must be at least 8 characters.','error');return;}
  if(!/[A-Z]/.test(np)){HMS.showAlert('Password must contain an uppercase letter.','error');return;}
  if(!/[a-z]/.test(np)){HMS.showAlert('Password must contain a lowercase letter.','error');return;}
  if(!/[0-9]/.test(np)){HMS.showAlert('Password must contain a number.','error');return;}
  var btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Updating…';
  HMS.api.post('/api/change-password',{current_password:curr,new_password:np,confirm_password:cp}).then(function(d){
    if(d.ok){HMS.showAlert(d.message,'success');setTimeout(function(){window.location.href='/dashboard';},1500);}
    else{HMS.showAlert(d.error||'Could not update password.','error');btn.disabled=false;btn.textContent='🔐 Update Password';}
  });
}
</script>
</body>
</html>
