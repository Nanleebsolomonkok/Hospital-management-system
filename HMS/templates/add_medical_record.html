<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Medical Record — MediCore HMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/medicore.css">
</head>
<body>
<div class="mobile-topbar" id="mobileTopbar"><button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button><a href="/dashboard" class="mobile-brand"><div class="mobile-brand-icon">🏥</div><strong>MediCore</strong></a></div>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand"><a href="/dashboard" class="brand-logo"><div class="brand-icon">🏥</div><div class="brand-text"><strong>MediCore</strong><span>Hospital MS</span></div></a></div>
  <div class="sidebar-user"><div class="user-avatar" id="userAvatar">U</div><div class="user-info"><div class="user-name" id="userName">Loading…</div><span class="role-pill" id="userRole"></span></div></div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer"><a href="#" class="logout-btn" onclick="doLogout()"><span>⏻</span> Sign Out</a></div>
</aside>
<main class="main">
  <header class="topbar">
    <div><div class="page-title">Add Medical Record</div></div>
    <div class="topbar-actions"><a href="/patients" class="topbar-btn btn-secondary">Cancel</a></div>
  </header>
  <div class="content-area">
    <div id="alertContainer" class="alerts"></div>
    <div style="max-width:740px;">
      <div class="card">
        <div class="card-header"><div class="card-header-left"><div class="card-title">📝 New Medical Record</div><div class="card-subtitle">Document diagnosis, prescription, and treatment plan</div></div></div>
        <div class="card-body">
          <div class="form-grid form-grid-2">
            <div class="form-group"><label class="form-label required">Patient</label><select class="form-control" id="patient_id" required><option value="">Loading…</option></select></div>
            <div class="form-group"><label class="form-label required">Doctor</label><select class="form-control" id="doctor_id" required><option value="">Loading…</option></select></div>
          </div>
          <div class="form-group" style="margin-top:12px;"><label class="form-label required">Diagnosis</label><textarea class="form-control" id="diagnosis" rows="3" required placeholder="Enter clinical diagnosis and observations…"></textarea></div>
          <div class="form-group"><label class="form-label">Prescription</label><textarea class="form-control" id="prescription" rows="2" placeholder="Medications, dosages, and frequency…"></textarea></div>
          <div class="form-group"><label class="form-label">Treatment Plan</label><textarea class="form-control" id="treatment_plan" rows="2" placeholder="Recommended follow-up and treatment steps…"></textarea></div>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-bottom:24px;">
        <a href="/patients" class="topbar-btn btn-secondary">Cancel</a>
        <button class="topbar-btn btn-accent" id="submitBtn" onclick="submit()">💾 Save Record</button>
      </div>
    </div>
  </div>
</main>
<script src="/static/js/medicore.js"></script>
<script>
HMS.init();
window.onHMSReady=function(){
  var preselect=new URLSearchParams(window.location.search).get('patient_id');
  HMS.api.get('/api/form-data/medical-records').then(function(d){
    if(!d.ok)return;
    document.getElementById('patient_id').innerHTML='<option value="">Select patient</option>'+d.patients.map(function(p){var sel=(preselect&&parseInt(preselect)===p.patient_id)?' selected':'';return '<option value="'+p.patient_id+'"'+sel+'>'+p.first_name+' '+p.last_name+' (#'+p.patient_id+')</option>';}).join('');
    document.getElementById('doctor_id').innerHTML='<option value="">Select doctor</option>'+d.doctors.map(function(doc){return '<option value="'+doc.doctor_id+'">Dr. '+doc.first_name+' '+doc.last_name+' — '+doc.specialization+'</option>';}).join('');
  });
};
function g(id){return document.getElementById(id).value.trim();}
function submit(){
  if(!g('patient_id')||!g('doctor_id')||!g('diagnosis')){HMS.showAlert('Patient, doctor, and diagnosis are required.','error');return;}
  var btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Saving…';
  HMS.api.post('/api/medical-records/add',{patient_id:parseInt(g('patient_id')),doctor_id:parseInt(g('doctor_id')),diagnosis:g('diagnosis'),prescription:g('prescription'),treatment_plan:g('treatment_plan')})
  .then(function(d){
    if(d.ok){HMS.showAlert(d.message,'success');setTimeout(function(){window.location.href='/patients';},1200);}
    else{HMS.showAlert(d.error||'Could not save record.','error');btn.disabled=false;btn.textContent='💾 Save Record';}
  });
}
</script>
</body>
</html>
