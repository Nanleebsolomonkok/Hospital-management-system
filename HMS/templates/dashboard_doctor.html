<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Dashboard — MediCore HMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/medicore.css">
</head>
<body>
<div class="mobile-topbar" id="mobileTopbar"><button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button><a href="/dashboard" class="mobile-brand"><div class="mobile-brand-icon">🏥</div><strong>MediCore</strong></a></div>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand"><a href="/dashboard" class="brand-logo"><div class="brand-icon">🏥</div><div class="brand-text"><strong>MediCore</strong><span>Hospital MS</span></div></a></div>
  <div class="sidebar-user"><div class="user-avatar" id="userAvatar">D</div><div class="user-info"><div class="user-name" id="userName">Loading…</div><span class="role-pill" id="userRole"></span></div></div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer"><a href="#" class="logout-btn" onclick="doLogout()"><span>⏻</span> Sign Out</a></div>
</aside>
<main class="main">
  <header class="topbar">
    <div><div class="page-title">Doctor Dashboard</div></div>
    <div class="topbar-actions"><a href="/medical-records/add" class="topbar-btn btn-accent">📝 Add Record</a></div>
  </header>
  <div class="content-area">
    <div id="alertContainer" class="alerts"></div>
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card stat-blue"><div class="skeleton skeleton-card" style="height:80px;"></div></div>
      <div class="stat-card stat-amber"><div class="skeleton skeleton-card" style="height:80px;"></div></div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-header-left"><div class="card-title">📅 Upcoming Appointments</div><div class="card-subtitle">Your scheduled patient visits</div></div>
        <span class="badge badge-DOCTOR">Medical Staff</span>
      </div>
      <div id="apptContent"></div>
    </div>
    <div class="restricted-card"><div class="lock">🔒</div><strong>Billing &amp; Financial Data</strong><p>Access restricted to billing staff and administrators.</p></div>
  </div>
</main>
<script src="/static/js/medicore.js"></script>
<script>
HMS.init();
window.onHMSReady = function() {
  document.getElementById('apptContent').innerHTML = HMS.skeletonRows(5, 4);
  HMS.api.get('/api/dashboard/doctor').then(function(d) {
    if (!d.ok) return;
    document.getElementById('statsGrid').innerHTML =
      '<div class="stat-card stat-blue"><div class="stat-icon-wrap stat-icon-blue">👥</div><div class="stat-value">' + d.patient_count + '</div><div class="stat-label">My Patients</div></div>' +
      '<div class="stat-card stat-amber"><div class="stat-icon-wrap stat-icon-amber">📅</div><div class="stat-value">' + d.appointments.length + '</div><div class="stat-label">Upcoming Appointments</div></div>';
    var appts = d.appointments;
    if (!appts.length) { document.getElementById('apptContent').innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><h4>No upcoming appointments</h4><p>Your schedule is clear.</p></div>'; return; }
    var rows = appts.map(function(a) {
      return '<tr><td><div class="fw-600">' + a.appointment_date + '</div><div class="text-muted">' + a.appointment_time + '</div></td>' +
        '<td class="col-name">' + a.patient_first + ' ' + a.patient_last + '</td>' +
        '<td class="text-sm">' + (a.reason||'—') + '</td>' +
        '<td>' + HMS.statusBadge(a.status) + '</td>' +
        '<td style="display:flex;gap:6px;"><a href="/patients/' + a.patient_id + '" class="topbar-btn btn-ghost btn-xs">View</a>' +
        '<a href="/medical-records/add?patient_id=' + a.patient_id + '" class="topbar-btn btn-accent btn-xs">+ Record</a></td></tr>';
    }).join('');
    document.getElementById('apptContent').innerHTML = '<div class="table-container"><table class="data-table"><thead><tr><th>Date &amp; Time</th><th>Patient</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  });
};
</script>
</body>
</html>
