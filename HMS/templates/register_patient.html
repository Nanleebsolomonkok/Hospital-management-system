<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Patient — MediCore HMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/medicore.css">
</head>
<body>
<div class="mobile-topbar" id="mobileTopbar"><button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button><a href="/dashboard" class="mobile-brand"><div class="mobile-brand-icon">🏥</div><strong>MediCore</strong></a></div>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand"><a href="/dashboard" class="brand-logo"><div class="brand-icon">🏥</div><div class="brand-text"><strong>MediCore</strong><span>Hospital MS</span></div></a></div>
  <div class="sidebar-user"><div class="user-avatar" id="userAvatar">U</div><div class="user-info"><div class="user-name" id="userName">Loading…</div><span class="role-pill" id="userRole"></span></div></div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer"><a href="#" class="logout-btn" onclick="doLogout()"><span>⏻</span> Sign Out</a></div>
</aside>
<main class="main">
  <header class="topbar">
    <div><div class="page-title">Register New Patient</div><div class="breadcrumb" style="margin-top:2px;"><a href="/patients">Patients</a><span class="breadcrumb-sep">›</span><span class="breadcrumb-current">Register</span></div></div>
    <div class="topbar-actions"><a href="/patients" class="topbar-btn btn-secondary">Cancel</a></div>
  </header>
  <div class="content-area">
    <div id="alertContainer" class="alerts"></div>
    <div style="max-width:780px;">
      <div class="card">
        <div class="card-header"><div class="card-title">👤 Personal Information</div></div>
        <div class="card-body">
          <div class="form-grid form-grid-2">
            <div class="form-group"><label class="form-label required">First Name</label><input type="text" class="form-control" id="first_name" placeholder="John"></div>
            <div class="form-group"><label class="form-label required">Last Name</label><input type="text" class="form-control" id="last_name" placeholder="Doe"></div>
            <div class="form-group"><label class="form-label required">Date of Birth</label><input type="date" class="form-control" id="date_of_birth"></div>
            <div class="form-group"><label class="form-label required">Gender</label>
              <select class="form-control" id="gender"><option value="">Select gender</option><option>Male</option><option>Female</option><option>Other</option></select>
            </div>
            <div class="form-group"><label class="form-label">Email Address</label><input type="email" class="form-control" id="email" placeholder="john@example.com"></div>
            <div class="form-group"><label class="form-label">Phone Number</label><input type="tel" class="form-control" id="phone" placeholder="+1 234 567 8900"></div>
          </div>
          <div class="form-group" style="margin-top:14px;"><label class="form-label">Address</label><textarea class="form-control" id="address" rows="2" placeholder="Street, City, State, ZIP"></textarea></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">🩺 Medical Information</div></div>
        <div class="card-body">
          <div class="form-grid form-grid-2">
            <div class="form-group"><label class="form-label">Blood Group</label>
              <select class="form-control" id="blood_group"><option value="">Unknown</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select>
            </div>
            <div class="form-group"><label class="form-label">Insurance ID</label><input type="text" class="form-control" id="insurance_id" placeholder="INS-XXXXXXXX"></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">🚨 Emergency Contact</div></div>
        <div class="card-body">
          <div class="form-grid form-grid-2">
            <div class="form-group"><label class="form-label">Contact Name</label><input type="text" class="form-control" id="emergency_name" placeholder="Jane Doe"></div>
            <div class="form-group"><label class="form-label">Contact Phone</label><input type="tel" class="form-control" id="emergency_phone" placeholder="+1 234 567 8900"></div>
          </div>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-bottom:24px;">
        <a href="/patients" class="topbar-btn btn-secondary">Cancel</a>
        <button class="topbar-btn btn-accent" id="submitBtn" onclick="submit()">💾 Register Patient</button>
      </div>
    </div>
  </div>
</main>
<script src="/static/js/medicore.js"></script>
<script>
HMS.init();
function g(id){return document.getElementById(id).value.trim();}
function submit(){
  if(!g('first_name')||!g('last_name')||!g('date_of_birth')||!g('gender')){HMS.showAlert('Please fill all required fields.','error');return;}
  var btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='Saving…';
  HMS.api.post('/api/patients/register',{first_name:g('first_name'),last_name:g('last_name'),date_of_birth:g('date_of_birth'),gender:g('gender'),email:g('email'),phone:g('phone'),address:g('address'),blood_group:g('blood_group'),insurance_id:g('insurance_id'),emergency_name:g('emergency_name'),emergency_phone:g('emergency_phone')})
  .then(function(d){
    if(d.ok){HMS.showAlert(d.message,'success');setTimeout(function(){window.location.href='/patients';},1200);}
    else{HMS.showAlert(d.error||'Registration failed.','error');btn.disabled=false;btn.textContent='💾 Register Patient';}
  });
}
</script>
</body>
</html>
