<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — MediCore HMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    .wrap{text-align:center;max-width:420px;}
    .code{font-family:'Plus Jakarta Sans',sans-serif;font-size:96px;font-weight:800;color:#e2e8f0;line-height:1;margin-bottom:8px;letter-spacing:-4px;}
    .icon{font-size:48px;margin-bottom:20px;}
    h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:24px;font-weight:700;color:#0f172a;margin-bottom:10px;}
    p{font-size:14px;color:#64748b;line-height:1.6;margin-bottom:28px;}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;background:#2563eb;color:#fff;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600;transition:.18s ease;}
    .btn:hover{background:#1d4ed8;}
    .btn-ghost{background:transparent;color:#475569;border:1.5px solid #e2e8f0;margin-left:8px;}
    .btn-ghost:hover{background:#f8fafc;border-color:#cbd5e1;color:#0f172a;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="icon">🏥</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or you don't have permission to view it.</p>
    <div>
      <a href="/dashboard" class="btn">← Dashboard</a>
      <a href="javascript:history.back()" class="btn btn-ghost">Go Back</a>
    </div>
  </div>
</body>
</html>
